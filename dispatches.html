<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatches — Geanna Orozco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100;9..144,400;9..144,700;9..144,900&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Fraunces', serif; background: #fff; color: #111; min-height: 100vh; display: flex; flex-direction: column; }
  nav { display: flex; align-items: center; justify-content: flex-end; padding: 28px 48px; border-bottom: 0.5px solid #ebebeb; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #111; text-decoration: none; transition: color 0.15s; }
  .nav-links a:hover { color: #F03621; }
  .nav-links a.current { color: #F03621; }
  main { flex: 1; padding: 60px 32px 70px; }
  .label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #ccc; margin-bottom: 32px; padding-left: 16px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .grid-item {
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    background: #f4f4f4;
  }
  .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.15s;
  }
  .grid-item:hover img { opacity: 0.85; }
  .grid-item-text {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    background: #fafafa;
    transition: background 0.15s;
  }
  .grid-item-text:hover { background: #f0f0f0; }
  .grid-item-text-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 13px;
    color: #1338BE;
    line-height: 1.3;
  }

  .lightbox-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.98);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 40px;
    cursor: pointer;
  }
  .lightbox-overlay.active { display: flex; }
  .lightbox-post {
    max-width: 480px;
    width: 100%;
    cursor: default;
    text-align: left;
  }
  .lightbox-post img {
    width: 100%;
    display: block;
    margin-bottom: 24px;
    border-radius: 2px;
  }
  .lightbox-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ccc;
    margin-bottom: 10px;
  }
  .lightbox-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    color: #1338BE;
    margin-bottom: 18px;
  }
  .lightbox-text {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    line-height: 1.8;
    color: #111;
    font-weight: 400;
  }
  .lightbox-close {
    position: absolute;
    top: 28px;
    right: 40px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #999;
    cursor: pointer;
    transition: color 0.15s;
  }
  .lightbox-close:hover { color: #F03621; }

  @media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 3px; }
    nav { padding: 20px 24px; } main { padding: 40px 16px 50px; }
    .nav-links { gap: 16px; } .nav-links a { font-size: 9px; }
    .label { padding-left: 8px; }
    .lightbox-close { top: 18px; right: 20px; }
    .lightbox-overlay { padding: 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="work.html">Work</a>
    <a href="photography.html">Photography</a>
    <a href="dispatches.html" class="current">Dispatches</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<main>
  <div class="label">Dispatches</div>
  <div class="grid" id="dispatch-grid">

    <div class="grid-item" onclick="openPost(0)">
      <img src="images/dispatches/nicaragua-01.jpg" alt="">
    </div>

  </div>
</main>

<div class="lightbox-overlay" id="lightbox" onclick="closeLightbox(event)">
  <span class="lightbox-close" onclick="closeLightbox(event)">Close ✕</span>
  <div class="lightbox-post" id="lightbox-post"></div>
</div>

<script>
  const posts = [
    {
      date: "May 2026",
      title: "Nicaragua",
      image: "images/dispatches/nicaragua-01.jpg",
      text: "Roadtripping through Nicaragua. First part of a research trip in preparation for my thesis documentary on INCINE."
    }
  ];

  function openPost(index) {
    const post = posts[index];
    let html = '<div class="lightbox-date">' + post.date + '</div>';
    html += '<div class="lightbox-title">' + post.title + '</div>';
    if (post.image) {
      html += '<img src="' + post.image + '" alt="">';
    }
    html += '<div class="lightbox-text">' + post.text + '</div>';
    document.getElementById('lightbox-post').innerHTML = html;
    document.getElementById('lightbox').classList.add('active');
  }

  function closeLightbox(e) {
    if (e.target.id === 'lightbox' || e.target.classList.contains('lightbox-close')) {
      document.getElementById('lightbox').classList.remove('active');
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
  });
</script>

</body>
</html>
